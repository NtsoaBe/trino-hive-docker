version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"

  # A sidecar container that automatically creates the "warehouse" bucket on startup
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/warehouse || true;
      mc anonymous set public myminio/warehouse;
      "

  hive-metastore:
    build: .
    depends_on:
      - postgres
      - minio
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=metastore
      - DB_USER=hive
      - DB_PASSWORD=hive
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - WAREHOUSE_DIR=s3a://warehouse/
    ports:
      - "9083:9083"

  trino:
    image: trinodb/trino:latest
    depends_on:
      - hive-metastore
      - minio
    ports:
      - "8080:8080" # Trino web UI and SQL port
    volumes:
      # Mount our custom catalogs over to Trino
      - ./trino/catalog:/etc/trino/catalog

volumes:
  postgres_data:
  minio_data: